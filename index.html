<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>فروش‌یار</title>
  
  <!-- تنظیمات آیکن‌های استاندارد -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#d81b60">

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.7/dist/jalaali.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --primary: #d81b60;
      --primary-light: #fce4ec;
      --secondary: #8e24aa;
      --bg: #f4f5f9;
      --surface: #ffffff;
      --text: #212121;
      --text-secondary: #757575;
      --border: #e0e0e0;
      --success: #2e7d32;
      --danger: #c62828;
      --warning: #ef6c00;
      --info: #0288d1;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    .app-container { max-width: 600px; margin: 0 auto; background: var(--bg); min-height: 100vh; padding-bottom: 90px; position: relative; }

    /* Header */
    .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 18px; text-align: center; border-radius: 0 0 24px 24px; box-shadow: 0 4px 20px rgba(216,27,96,0.3); position: sticky; top: 0; z-index: 100; }
    .header h1 { margin: 0; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .header p { margin: 4px 0 0; opacity: 0.9; font-size: 0.82rem; }

    .section { display: none; }
    .section.active { display: block; }

    /* Cards */
    .card { background: var(--surface); margin: 12px; padding: 16px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; justify-content: space-between; }
    
    /* Buttons */
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .btn { border: none; padding: 10px 12px; border-radius: 12px; font-family: inherit; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; color: white; width: 100%; transition: transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-warning { background: var(--warning); }
    .btn-primary { background: var(--primary); }
    .btn-info { background: var(--info); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-sm { padding: 6px 10px; font-size: 0.78rem; border-radius: 8px; }

    /* Inputs */
    .form-group { margin-bottom: 10px; }
    .form-label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
    .form-input, .form-select { width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 0.88rem; background: var(--surface); outline: none; }
    .form-input:focus, .form-select:focus { border-color: var(--primary); }

    /* 3-BLOCK SALE INVOICE DESIGN */
    .sale-block { background: var(--surface); border-radius: 16px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .sale-block-title { font-size: 0.9rem; font-weight: 800; color: var(--secondary); margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; display: flex; align-items: center; gap: 6px; }

    /* Middle Block Items List */
    .sale-items-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .sale-item-card { background: #fafafa; border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .sale-item-info { font-size: 0.85rem; }
    .sale-item-actions { display: flex; gap: 4px; }

    /* Invoice Output Box for Share/Export */
    .invoice-box { background: #fff; color: #212121; padding: 20px; border-radius: 16px; border: 2px dashed #d81b60; font-size: 0.88rem; }
    .invoice-header { text-align: center; border-bottom: 2px dashed #d81b60; padding-bottom: 10px; margin-bottom: 10px; }
    .invoice-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 0.5px dashed #eee; font-size: 0.85rem; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: var(--surface); display: flex; justify-content: space-around; padding: 6px 2px; border-top: 1px solid var(--border); box-shadow: 0 -4px 15px rgba(0,0,0,0.05); z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); text-decoration: none; font-size: 0.68rem; gap: 2px; flex: 1; cursor: pointer; text-align: center; }
    .nav-item i { font-size: 1.1rem; }
    .nav-item.active { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header">
    <h1><i class="fas fa-shopping-bag"></i> <span id="header-title">فروش‌یار</span></h1>
    <p id="header-subtitle">سیستم جامع حسابداری و صدور فاکتور</p>
  </div>

  <!-- SALE SECTION -->
  <div id="sec-sales" class="section active" style="padding: 10px;">
    
    <!-- بلوک بالایی (فرم ورود اطلاعات) -->
    <div class="sale-block">
      <div class="sale-block-title"><i class="fas fa-edit"></i> <span>بلوک اول: تنظیمات و ورود کالا</span></div>
      
      <!-- ردیف اول: مشتری و تخفیف -->
      <div class="row-2">
        <div class="form-group">
          <label class="form-label">مشتری</label>
          <select id="sale-customer" class="form-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">تخفیف کل (تومان)</label>
          <input type="number" id="sale-discount" class="form-input" value="0" oninput="calcTotals()">
        </div>
      </div>

      <!-- ردیف دوم: کالا و تعداد -->
      <div class="row-2">
        <div class="form-group">
          <label class="form-label">کالا</label>
          <select id="sale-product-select" class="form-select" onchange="onProductSelectChange()"></select>
        </div>
        <div class="form-group">
          <label class="form-label">تعداد</label>
          <input type="number" id="sale-qty-input" class="form-input" value="1" min="1">
        </div>
      </div>

      <!-- ردیف سوم: قیمت واحد، جمع و دریافتی -->
      <div class="row-3">
        <div class="form-group">
          <label class="form-label">قیمت واحد</label>
          <input type="number" id="sale-price-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">جمع کالا</label>
          <input type="number" id="sale-item-total" class="form-input" readonly style="background:#f5f5f5;">
        </div>
        <div class="form-group">
          <label class="form-label">دریافتی کل</label>
          <input type="number" id="sale-received" class="form-input" placeholder="0" oninput="calcTotals()">
        </div>
      </div>

      <!-- ردیف چهارم: کادر ثبت کالا و دسته‌بندی -->
      <div class="row-2" style="margin-top: 4px;">
        <div class="form-group">
          <label class="form-label">دسته‌بندی کالا</label>
          <input type="text" id="sale-category-input" class="form-input" placeholder="مثلاً: پوشاک">
        </div>
        <div class="form-group" style="display:flex; align-items:flex-end;">
          <button class="btn btn-primary" onclick="addItemToInvoice()" style="height:40px;"><i class="fas fa-plus"></i> درج کالا</button>
        </div>
      </div>
    </div>

    <!-- بلوک میانی (لیست پویا اقلام اضافه شده) -->
    <div class="sale-block">
      <div class="sale-block-title"><i class="fas fa-list-ol"></i> <span>بلوک دوم: اقلام فاکتور</span></div>
      <div id="sale-items-list" class="sale-items-list">
        <!-- به‌طور پیش‌فرض خالی است و با افزودن کالا پر می‌شود -->
        <div id="empty-list-msg" style="text-align:center; color:#999; padding:15px; font-size:0.85rem;">هنوز کالایی به فاکتور اضافه نشده است</div>
      </div>

      <!-- خلاصه محاسبات -->
      <div style="margin-top:12px; background:#f9f9f9; padding:10px; border-radius:10px; font-size:0.85rem;">
        <div class="invoice-row"><span>جمع فاکتور:</span><b id="lbl-total-sum">۰ تومان</b></div>
        <div class="invoice-row" style="color:var(--danger);"><span>مانده بدهی:</span><b id="lbl-remaining">۰ تومان</b></div>
      </div>
    </div>

    <!-- بلوک پایینی (اشتراک‌گذاری و ذخیره‌سازی) -->
    <div class="sale-block">
      <div class="sale-block-title"><i class="fas fa-share-alt"></i> <span>بلوک سوم: خروجی و ذخیره‌سازی</span></div>
      <div class="row-2" style="margin-bottom:8px;">
        <button class="btn btn-success" onclick="shareAsImage()"><i class="fas fa-image"></i> اشتراک تصویری</button>
        <button class="btn btn-info" onclick="shareAsText()"><i class="fas fa-file-alt"></i> اشتراک متنی</button>
      </div>
      <div class="row-2">
        <button class="btn btn-warning" onclick="saveAsImage()"><i class="fas fa-download"></i> ذخیره تصویر</button>
        <button class="btn btn-outline" onclick="saveAsText()"><i class="fas fa-save"></i> ذخیره متن</button>
      </div>
    </div>

  </div>
</div>

<!-- المان پنهان جهت تولید خروجی تصویری با طول پویا -->
<div id="invoice-render-area" style="position:absolute; left:-9999px; top:-9999px; width:450px;"></div>

<script>
  let currentItems = [];
  let products = [
    { id: 1, name: "شلوار جین", price: 450000, category: "پوشاک" },
    { id: 2, name: "مانتو کتان", price: 550000, category: "پوشاک" }
  ];
  let customers = ["مشتری عمومی", "علی محمدی", "زهرا احمدی"];

  function init() {
    let custSelect = document.getElementById('sale-customer');
    custSelect.innerHTML = customers.map(c => `<option value="${c}">${c}</option>`).join('');

    let prodSelect = document.getElementById('sale-product-select');
    prodSelect.innerHTML = products.map(p => `<option value="${p.id}" data-price="${p.price}" data-cat="${p.category}">${p.name}</option>`).join('');

    onProductSelectChange();
  }

  function onProductSelectChange() {
    let select = document.getElementById('sale-product-select');
    let opt = select.options[select.selectedIndex];
    if(opt) {
      document.getElementById('sale-price-input').value = opt.getAttribute('data-price') || 0;
      document.getElementById('sale-category-input').value = opt.getAttribute('data-cat') || '';
      calcItemTotal();
    }
  }

  function calcItemTotal() {
    let qty = Number(document.getElementById('sale-qty-input').value) || 1;
    let price = Number(document.getElementById('sale-price-input').value) || 0;
    document.getElementById('sale-item-total').value = qty * price;
  }

  document.getElementById('sale-qty-input').addEventListener('input', calcItemTotal);
  document.getElementById('sale-price-input').addEventListener('input', calcItemTotal);

  function addItemToInvoice() {
    let select = document.getElementById('sale-product-select');
    let prodName = select.options[select.selectedIndex].text;
    let qty = Number(document.getElementById('sale-qty-input').value) || 1;
    let price = Number(document.getElementById('sale-price-input').value) || 0;
    let category = document.getElementById('sale-category-input').value || '-';

    currentItems.push({ id: Date.now(), name: prodName, qty, price, category, total: qty * price });
    renderItemsList();
    calcTotals();
  }

  function renderItemsList() {
    let listEl = document.getElementById('sale-items-list');
    if(currentItems.length === 0) {
      listEl.innerHTML = '<div id="empty-list-msg" style="text-align:center; color:#999; padding:15px; font-size:0.85rem;">هنوز کالایی به فاکتور اضافه نشده است</div>';
      return;
    }

    let html = '';
    currentItems.forEach((item, index) => {
      html += `
        <div class="sale-item-card">
          <div class="sale-item-info">
            <b>${index + 1}. ${item.name}</b> <small style="color:#777;">(${item.category})</small><br>
            <small>${item.qty} عدد × ${item.price.toLocaleString('fa-IR')} = <b>${item.total.toLocaleString('fa-IR')} تومان</b></small>
          </div>
          <div class="sale-item-actions">
            <button class="btn btn-danger btn-sm" onclick="removeItem(${item.id})"><i class="fas fa-trash"></i></button>
          </div>
        </div>`;
    });
    listEl.innerHTML = html;
  }

  function removeItem(id) {
    currentItems = currentItems.filter(x => x.id !== id);
    renderItemsList();
    calcTotals();
  }

  function calcTotals() {
    let sum = currentItems.reduce((a, b) => a + b.total, 0);
    let discount = Number(document.getElementById('sale-discount').value) || 0;
    let received = Number(document.getElementById('sale-received').value) || 0;

    let finalTotal = Math.max(0, sum - discount);
    let remaining = Math.max(0, finalTotal - received);

    document.getElementById('lbl-total-sum').innerText = finalTotal.toLocaleString('fa-IR') + ' تومان';
    document.getElementById('lbl-remaining').innerText = remaining.toLocaleString('fa-IR') + ' تومان';
  }

  /* --- فرمت‌دهی خروجی متنی --- */
  function generateFormattedText() {
    let customer = document.getElementById('sale-customer').value;
    let discount = Number(document.getElementById('sale-discount').value) || 0;
    let received = Number(document.getElementById('sale-received').value) || 0;
    let sum = currentItems.reduce((a, b) => a + b.total, 0);
    let finalTotal = Math.max(0, sum - discount);
    let remaining = Math.max(0, finalTotal - received);

    let text = `🛍️ **فاکتور فروش فروشگاه**\n`;
    text += `👤 **مشتری:** ${customer}\n`;
    text += `📅 **تاریخ:** ${new Date().toLocaleDateString('fa-IR')}\n`;
    text += `-----------------------------------\n`;
    
    currentItems.forEach((it, idx) => {
      text += `${idx + 1}. ${it.name}\n   ${it.qty} عدد × ${it.price.toLocaleString('fa-IR')} = ${it.total.toLocaleString('fa-IR')} تومان\n`;
    });

    text += `-----------------------------------\n`;
    text += `💰 **جمع کل:** ${sum.toLocaleString('fa-IR')} تومان\n`;
    if(discount > 0) text += `🏷️ **تخفیف:** ${discount.toLocaleString('fa-IR')} تومان\n`;
    text += `💳 **قابل پرداخت:** ${finalTotal.toLocaleString('fa-IR')} تومان\n`;
    text += `💵 **دریافتی:** ${received.toLocaleString('fa-IR')} تومان\n`;
    text += `⚠️ **مانده بدهی:** ${remaining.toLocaleString('fa-IR')} تومان\n`;
    text += `-----------------------------------\n`;
    text += `🙏 **از خرید شما سپاسگزاریم!**`;

    return text;
  }

  /* --- اشتراک‌گذاری و ذخیره‌سازی --- */
  function shareAsText() {
    let txt = generateFormattedText();
    if(navigator.share) {
      navigator.share({ title: 'فاکتور فروش', text: txt }).catch(()=>{});
    } else {
      navigator.clipboard.writeText(txt);
      alert('متن فاکتور در حافظه کپی شد.');
    }
  }

  async function saveAsText() {
    let txt = generateFormattedText();
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'invoice.txt',
          types: [{ description: 'Text File', accept: { 'text/plain': ['.txt'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(txt);
        await writable.close();
      } catch (err) {}
    } else {
      let blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'invoice.txt';
      a.click();
    }
  }

  function prepareRenderArea() {
    let renderArea = document.getElementById('invoice-render-area');
    let customer = document.getElementById('sale-customer').value;
    let discount = Number(document.getElementById('sale-discount').value) || 0;
    let received = Number(document.getElementById('sale-received').value) || 0;
    let sum = currentItems.reduce((a, b) => a + b.total, 0);
    let finalTotal = Math.max(0, sum - discount);
    let remaining = Math.max(0, finalTotal - received);

    let itemsHtml = currentItems.map((it, i) => `
      <div class="invoice-row">
        <span>${i+1}. ${it.name} (${it.qty} عدد)</span>
        <b>${it.total.toLocaleString('fa-IR')} تومان</b>
      </div>
    `).join('');

    renderArea.innerHTML = `
      <div class="invoice-box">
        <div class="invoice-header">
          <h3 style="margin:0; color:#d81b60;">فروشگاه گوزل لر</h3>
          <small>فاکتور رسمی فروش</small>
        </div>
        <div class="invoice-row"><span>مشتری:</span> <b>${customer}</b></div>
        <div class="invoice-row"><span>تاریخ:</span> <b>${new Date().toLocaleDateString('fa-IR')}</b></div>
        <hr style="border:0.5px dashed #d81b60; margin:8px 0;">
        ${itemsHtml}
        <hr style="border:0.5px dashed #d81b60; margin:8px 0;">
        <div class="invoice-row"><span>جمع کل:</span> <b>${sum.toLocaleString('fa-IR')} تومان</b></div>
        <div class="invoice-row"><span>تخفیف:</span> <b>${discount.toLocaleString('fa-IR')} تومان</b></div>
        <div class="invoice-row" style="font-weight:bold; color:#d81b60;"><span>مبلغ نهایی:</span> <b>${finalTotal.toLocaleString('fa-IR')} تومان</b></div>
        <div class="invoice-row"><span>دریافتی:</span> <b>${received.toLocaleString('fa-IR')} تومان</b></div>
        <div class="invoice-row" style="color:#c62828;"><span>مانده بدهی:</span> <b>${remaining.toLocaleString('fa-IR')} تومان</b></div>
      </div>
    `;
  }

  function shareAsImage() {
    prepareRenderArea();
    let renderArea = document.getElementById('invoice-render-area');
    html2canvas(renderArea, { scale: 2 }).then(canvas => {
      canvas.toBlob(blob => {
        let file = new File([blob], 'invoice.png', { type: 'image/png' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file] }).catch(()=>{});
        } else {
          saveAsImage();
        }
      });
    });
  }

  function saveAsImage() {
    prepareRenderArea();
    let renderArea = document.getElementById('invoice-render-area');
    html2canvas(renderArea, { scale: 2 }).then(canvas => {
      let a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'invoice.png';
      a.click();
    });
  }

  init();
</script>
</body>
</html>
